name: Build Naomi Reading V3

on:
  push:
    branches: [naomi-reading-v3]
    paths:
      - 'naomi-reading-v3/**'
      - '.github/workflows/naomi-reading-v3-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: naomi-reading-v3
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: naomi-reading-v3-apk
          path: naomi-reading-v3/app/build/outputs/apk/debug/app-debug.apk
