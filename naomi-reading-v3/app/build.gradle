plugins { id 'com.android.application' }

android {
    namespace 'il.co.ravit.naomireading.v3'
    compileSdk 35

    defaultConfig {
        applicationId 'il.co.ravit.naomireading.v3'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
